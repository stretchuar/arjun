/* Layout: one-column phone console, fine rules instead of boxes, one stencil headline per screen.
   Style: Jorge 2.1 / Defender UI (paper and ink, stencil headings, small mono text, red = alarm, green = engaged). */
:root{--paper:#E6E5DF;--ink:#0C0C0C;--mute:#5b5b55;--line:#9c9b93;--red:#B92F1C;--green:#4A5A2B;--panel:#EFEEE9;
  --st:'Allerta Stencil',Impact,'Arial Narrow',sans-serif;--mo:'B612 Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A0A0A;--ink:#EDECE6;--mute:#9a9a92;--line:#4a4a45;--red:#F0533A;--green:#93A661;--panel:#141412;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0A0A0A;--ink:#EDECE6;--mute:#9a9a92;--line:#4a4a45;--red:#F0533A;--green:#93A661;--panel:#141412;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--mo)}
button,input,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:0;padding:6px 10px;min-height:44px}
button{cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
button:hover:not([disabled]){background:var(--ink);color:var(--paper)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.photolabel:focus-within{outline:2px solid var(--red);outline-offset:1px}
button[disabled]{opacity:.35;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 12px}
h1.word{margin:0;font:400 24px/1 var(--st);letter-spacing:.1em;text-transform:uppercase}
h1.word small{display:block;margin-top:6px;font:400 11px var(--mo);letter-spacing:.04em;color:var(--mute);text-transform:none}
.net{display:inline-flex;align-items:center;gap:8px;min-height:36px;font-size:11px}
.net i{width:8px;height:8px;background:var(--green)}
.net.off i{background:var(--red)}

main{flex:1;min-height:0;overflow-y:auto;padding-bottom:18px;display:flex;flex-direction:column;gap:16px}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--green)}
.sub{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:-6px}

.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--green);border-bottom:1px solid var(--green);color:var(--green);font-size:12px;letter-spacing:.04em}
.banner button{border:0;min-height:36px;padding:0;text-decoration:underline;font-size:11px;color:inherit}
.banner button:hover{background:transparent;color:inherit}

.card{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--ink);padding-top:14px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.meta span:last-child{text-align:right}
.q{margin:0;font:400 28px/1.14 var(--st);letter-spacing:.03em;text-wrap:balance}
.note{margin:0;font-size:12px;color:var(--mute);border-left:1px solid var(--line);padding-left:10px}
.linkbtn{align-self:flex-start;border:0;padding:0;min-height:36px;text-decoration:underline;text-underline-offset:3px;font-size:11px;color:var(--mute)}
.linkbtn:hover:not([disabled]){background:transparent;color:var(--ink)}
.links{display:flex;gap:18px;flex-wrap:wrap}

textarea,input[type=date],input[type=text],input[type=email]{width:100%;padding:12px;font-size:16px;line-height:1.5;background:var(--panel);text-transform:none;letter-spacing:0}
textarea{min-height:112px;resize:vertical}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 14px;text-align:left;text-transform:none;letter-spacing:.02em;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip small{display:block;font-size:11px;opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.chip.sugg{min-height:38px;border-style:dashed;font-size:12px}
.readout{font:400 28px/1.1 var(--st);letter-spacing:.04em}

.mic{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:.14em;position:relative}
.mic:hover:not([disabled]){background:var(--ink);color:var(--paper)}
.mic svg{width:24px;height:24px}
.mic.live{background:var(--red);border-color:var(--red);color:var(--paper)}
.mic.live:hover{background:var(--red)}
.mic.live::after{content:"";position:absolute;inset:-6px;border:1px solid var(--red);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.98)}to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.mic.live::after{animation:none}}
.hint{margin:0;font-size:12px;color:var(--mute);min-height:18px}

.row2{display:flex;gap:10px}
.row2 .btn{min-height:52px;padding:0 18px;font-size:13px;letter-spacing:.12em}
.btn.solid{flex:1}
.btn.go{flex:1;background:var(--green);border-color:var(--green);color:var(--paper)}
.btn.go:hover:not([disabled]){background:var(--green);color:var(--paper);filter:brightness(1.1)}

.photolabel{display:flex;align-items:center;justify-content:center;min-height:56px;border:1px solid var(--ink);cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.photolabel:hover{background:var(--ink);color:var(--paper)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;background:var(--panel);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:32px;height:32px;min-height:32px;padding:0;background:var(--paper);font-size:18px;line-height:1}

nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
nav.tabs button{min-height:56px;border:0;font-size:11px;letter-spacing:.05em;color:var(--mute);padding-inline:2px}
nav.tabs button[aria-current=page]{background:var(--ink);color:var(--paper)}
nav.tabs b{font-weight:400;margin-left:4px}

h2{margin:0;font:400 24px/1 var(--st);letter-spacing:.1em;text-transform:uppercase}
h2.q{font:400 28px/1.14 var(--st);letter-spacing:.03em;text-transform:none}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.list{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:1px solid var(--ink)}
.item .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code{font-weight:700;font-size:13px;letter-spacing:.04em}
.sev{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid currentColor;font:400 15px/1 var(--st)}
.sev.s4{color:var(--red)} .sev.s3{color:var(--red)} .sev.s2{color:var(--ink)} .sev.s1{color:var(--mute)}
.ex{font-size:10px;letter-spacing:.1em;color:var(--mute);margin-left:auto;text-transform:uppercase}
.item p{margin:0;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:700}
.small{font-size:12px;color:var(--mute);margin:0;overflow-wrap:anywhere}
.rm{align-self:flex-start;border:0;padding:0;min-height:36px;color:var(--mute);text-decoration:underline;font-size:11px}
.rm:hover:not([disabled]){background:transparent;color:var(--ink)}
.rm.arm{color:var(--red);font-weight:700}
.rm.arm:hover{color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.stat{padding:12px 0 4px}
.stat b{display:block;font:400 40px/1 var(--st);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.kv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.kv label,.lab{font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.kv div{font-size:12px;overflow-wrap:anywhere}
.kv .miss,.miss{color:var(--red);font-weight:700}
pre.mail{margin:0;padding:12px;background:var(--panel);border:1px solid var(--line);font:12px/1.5 var(--mo);overflow-x:auto;max-height:340px;overflow-y:auto;white-space:pre}
.empty{border-top:1px solid var(--ink);padding:24px 0;color:var(--mute)}

.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 44px;gap:6px}
.prow input{padding:8px;font-size:14px;min-height:44px}
.prow button{padding:0;font-size:18px}

html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
span.net{border:1px solid var(--line);padding:0 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- the SLI template (FAU-F-DSG-4001, row 38 headings and dropdown lists) ---------- */
function mk(a){return a.map(function(s){return{id:s,label:s.trim()}})}
var RESP=mk(['BG','Division','Program Team','Plant','Core Team']);
var SEV=[{id:4,label:'4',sub:'HSE',kw:['4','four','hse']},{id:3,label:'3',sub:'High, incl. S/R',kw:['3','three','high']},
         {id:2,label:'2',sub:'Medium, incl. S/R',kw:['2','two','medium']},{id:1,label:'1',sub:'Low',kw:['1','one','low']}];
var FUNC=mk(['Customer / Sales','Planning ','Economics ','Resources ','Project organization / Project','Product / R&D','Process','Production','Quality ','Supplier / Purchasing','HSE']);
var ORIGIN=mk(['DFMEA','PFMEA','Launch Review','PRC','Function review','DV & PV','Customer issues','PT','Supplier issue','Perceived quality review','Others','R@R','Tool Trail']);
var PROG=[0,0.1,0.25,0.5,0.75,0.9,0.95,1].map(function(v){return{id:v,label:Math.round(v*100)+'%'}});
var EFFECT=mk(['Effective ','Not effective ','Partly effective']);
var YN=[{id:'Y',label:'Yes',kw:['yes','yeah','yep','y']},{id:'N',label:'No',kw:['no','nope','n']}];

function iso(d){var m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+dd}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7)}
function wk(n){var d=new Date();d.setDate(d.getDate()+7*n);return 'WK'+('0'+isoWeek(d)).slice(-2)}
var ISO=/^\d{4}-\d{2}-\d{2}$/;
function dmy(s){if(!s)return'';if(!ISO.test(s))return s;var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function nice(s){if(!s)return'';if(!ISO.test(s))return s;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function short(s){if(!s)return'';if(!ISO.test(s))return s;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uniq(a){var o=[];a.forEach(function(x){if(x&&o.indexOf(x)<0)o.push(x)});return o}
function recent(key){var r=[];S.lines.forEach(function(l){if(!l.example&&l[key])r.push(String(l[key]).trim())});return uniq(r.reverse()).slice(0,6)}

/* ---------- settings (kept on the device) ---------- */
var STORE_OK=true;try{localStorage.setItem('arjun.t','1');localStorage.removeItem('arjun.t')}catch(e){STORE_OK=false}
function copySync(t){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);var ok=document.execCommand('copy');document.body.removeChild(ta);return ok}catch(e){return false}}
function dataFile(u,name){var p=u.split(','),m=p[0].match(/:(.*?);/)[1],bs=atob(p[1]),n=bs.length,a=new Uint8Array(n);while(n--)a[n]=bs.charCodeAt(n);return new File([a],name,{type:m})}
var KEYST='arjun.settings.v1';
var ST={sendTo:'stretchuar@gmail.com',program:'X900',sheet:'JEA X900',photoMode:'cell',photoCol:'W',areas:['UAP-1','UAP-2','UAP-3','PC&L','ALL'],people:[]};
try{var rs=localStorage.getItem(KEYST);if(rs){var so=JSON.parse(rs);for(var sk in so)ST[sk]=so[sk]}}catch(e){}
function saveST(){try{localStorage.setItem(KEYST,JSON.stringify(ST))}catch(e){}}
function colIdx(letter){var s=String(letter||'').toUpperCase().replace(/[^A-Z]/g,'');if(!s)return 22;var n=0;for(var i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);return Math.max(n-1,22)}
function colLetter(i){var s='';i++;while(i>0){var r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s}

/* name to email cross reference */
function ownerNames(str){var o=[];String(str||'').split(/\s*[\/,&]\s*/).forEach(function(x){x=x.trim();if(x&&o.indexOf(x)<0)o.push(x)});return o}
function findPerson(name){
  var n=String(name||'').trim().toLowerCase(),P=ST.people.filter(function(x){return x.n&&x.e});
  if(!n)return{status:'none'};
  var ex=P.filter(function(x){return x.n.trim().toLowerCase()===n});
  if(ex.length===1)return{status:'ok',p:ex[0]};
  var c=P.filter(function(x){var l=x.n.trim().toLowerCase();return l.indexOf(n)===0||l.split(/\s+/).indexOf(n)>-1});
  if(c.length===1)return{status:'ok',p:c[0]};
  if(c.length>1)return{status:'amb',list:c};
  return{status:'none'};
}
function matchText(str){
  var names=ownerNames(str);if(!names.length)return'';
  if(!ST.people.length)return'No email list yet. Add one in Settings.';
  return names.map(function(n){var r=findPerson(n);
    return r.status==='ok'?n+' → '+r.p.e:r.status==='amb'?n+' → '+r.list.length+' people match, be more specific':n+' → no email on file'}).join('; ');
}

/* ---------- questions, in the order of the SLI columns ---------- */
var STEPS=[
 {key:'program',col:'A',field:'Area',q:'Which area is this for?',type:'choice',other:1,ph:'Type the area',get opts(){return mk(ST.areas)},
  get note(){return 'The program ('+ST.program+') comes from Settings. The area goes in column A.'}},
 {key:'opened',col:'B',field:'Opening date',q:'When was the issue opened?',type:'date',
  chips:function(){return[['Today',plus(0)],['Yesterday',plus(-1)]]}},
 {key:'resp',col:'D',field:'Responsibility',q:'Who is responsible?',type:'choice',opts:RESP,note:'Program Core Team, Division or PRC.'},
 {key:'sev',col:'E',field:'Program SLI severity level',q:'How severe is it?',type:'choice',opts:SEV,
  note:'For HSE, level 4 is required for a risk of a severe accident, lack of compliance to Mandatory Rules or non-compliance to legal requirements.'},
 {key:'func',col:'F',field:'Impacted function',q:'Which function is impacted?',type:'choice',opts:FUNC,optional:1},
 {key:'origin',col:'G',field:'Origin / scope',q:'Where did the issue come from?',type:'choice',opts:ORIGIN,optional:1},
 {key:'machine',col:'H',field:'Related machine',q:'Which machine is it related to?',type:'text',short:1,optional:1,ph:'Machine or tool name',
  sugg:function(){return recent('machine')}},
 {key:'problem',col:'I',field:'Problem description',q:'What is the problem?',type:'text',ph:'Say or type the problem'},
 {key:'action',col:'N',field:'Containment action / countermeasure',q:'What is the containment action or countermeasure?',type:'text',ph:'Say or type the action',
  sugg:function(){return['Investigation needed']}},
 {key:'owner',col:'O',field:'Leader / pilot',q:'Who is the leader or pilot?',type:'text',short:1,ph:'Name',append:1,
  sugg:function(){return recent('owner')},datalist:function(){return ST.people.map(function(p){return p.n}).filter(Boolean)}},
 {key:'due',col:'P',field:'Date due',q:'When is it due?',type:'date',allowWk:1,
  chips:function(){return[['ASAP','ASAP'],[wk(0),wk(0)],[wk(1),wk(1)],[wk(2),wk(2)],[wk(3),wk(3)]]}},
 {key:'esc',col:'T',field:'Escalation or support required?',q:'Is escalation or support required?',type:'choice',opts:YN,optional:1},
 {key:'escDate',col:'U',field:'Date of escalation',q:'When was it escalated?',type:'date',optional:1,showIf:function(d){return d.esc==='Y'},
  chips:function(){return[['Today',plus(0)],['Yesterday',plus(-1)]]}},
 {key:'escTo',col:'V',field:'Escalation to whom or which function',q:'Escalated to whom or which function?',type:'text',short:1,optional:1,ph:'Name or function',
  showIf:function(d){return d.esc==='Y'}},
 {key:'photos',col:'',field:'Photos',q:'Do you want to add photos?',type:'photos',optional:1}
];
/* column order of the SLI row, A to V. J is the second half of the merged Problem description cell. */
var COLS=['program','opened','actionNo','resp','sev','func','origin','machine','problem',null,'deep','deepRef','root','action','owner','due','progress','done','effect','esc','escDate','escTo'];
var HEADS=['Related program (area)','Opening date','Action number (from LB SLI)','Responsibility','Program SLI severity level','Impacted function','Origin / scope','Related machine','Problem description','(merged with I)','Deep dive analysis required?','AMS / 8D / problem solving reference','Root cause(s)','Containment action / countermeasure','Leader / pilot','Date due','Level of progress','Date done','Effectiveness of actions taken','Escalation or support required?','Date of escalation','Escalation to whom or which function'];
var LET='ABCDEFGHIJKLMNOPQRSTUV'.split('');

function blank(){return{opened:plus(0)}}
function seed(){return[
 {u:1,example:true,program:'UAP-2',opened:plus(-2),actionNo:'',resp:'Core Team',sev:2,func:'Process',origin:'Function review',machine:'Example press',
  problem:'Example: fixture marks the part at unload',deep:'N',deepRef:'',root:'Investigation needed',action:'Check unload handling and re-inspect the last 20 parts',
  owner:'Example Owner',due:wk(1),progress:0.1,done:'',effect:'',esc:'N',escDate:'',escTo:'',photos:[null],pic:''},
 {u:2,example:true,program:'PC&L',opened:plus(-1),actionNo:'',resp:'Core Team',sev:3,func:'Supplier / Purchasing',origin:'Supplier issue',machine:'',
  problem:'Example: packaging not agreed for the JIT days of stock',deep:'Y',deepRef:'Example 8D ref',root:'Investigation needed',action:'Meeting with the supplier to agree the packaging and stock days',
  owner:'Example Owner',due:'ASAP',progress:0,done:'',effect:'',esc:'Y',escDate:plus(0),escTo:'Example Function',photos:[null,null],pic:''}
]}

/* ---------- state ---------- */
var KEY='arjun.sli.lines.v2';
var S={view:'capture',step:0,draft:blank(),photos:[],lines:[],sim:false,live:false,hint:'',banner:'',del:'',sent:'',readAloud:false,busy:false,pmsg:'',delP:false,markArm:false,delS:false};
try{var raw=localStorage.getItem(KEY);S.lines=raw?JSON.parse(raw):seed()}catch(e){S.lines=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.lines))}catch(e){S.hint='Storage is full, so the latest photos are not saved on this device.'}}
function online(){return !S.sim&&navigator.onLine!==false}
function active(){return STEPS.filter(function(s){return !s.showIf||s.showIf(S.draft)})}
function cur(){var a=active();if(S.step>=a.length)S.step=a.length-1;return a[S.step]}
function ready(){var s=cur();if(s.optional||s.type==='photos')return true;var v=S.draft[s.key];return v!==undefined&&v!==null&&String(v).trim()!==''}
function pend(){return S.lines.filter(function(l){return !l.sent})}
function empty(s){var v=S.draft[s.key];return v===undefined||v===null||String(v).trim()===''}

/* ---------- views ---------- */
var MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><rect x="9" y="3" width="6" height="12"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

function header(){
  return '<header class="top"><h1 class="word">Arjun 2.0<small>SLI '+esc(ST.sheet)+' · draft</small></h1>'+
  '<span class="net'+(online()?'':' off')+'"><i></i>'+(online()?'Online':'Offline')+'</span></header>';
}
function tabs(){
  var t=[['capture','Capture',''],['log','Log',pend().length],['export','Export',''],['settings','Settings','']];
  return '<nav class="tabs" aria-label="Sections">'+t.map(function(x){
    return '<button data-act="tab" data-v="'+x[0]+'"'+(S.view===x[0]?' aria-current="page"':'')+'>'+x[1]+(x[2]!==''?'<b>'+x[2]+'</b>':'')+'</button>'}).join('')+'</nav>';
}

function vCapture(){
  var A=active(),s=cur(),n=A.length,h='',d=S.draft;
  if(S.banner)h+='<div class="banner" role="status"><span>'+esc(S.banner)+'</span><button data-act="tab" data-v="log">View log</button></div>';
  h+='<div class="bar" aria-hidden="true"><i style="width:'+Math.round((S.step+1)/n*100)+'%"></i></div><div class="sub"><span>Item '+(pend().length+1)+'</span><span>Question '+(S.step+1)+'/'+n+'</span></div>';
  h+='<section class="card"><div class="meta"><span>'+(s.col?'Column '+s.col:'Photos')+'</span><span>'+esc(s.field)+(s.optional?' · optional':'')+'</span></div><h2 class="q">'+esc(s.q)+'</h2>';
  if(s.note)h+='<p class="note">'+esc(s.note)+'</p>';
  h+='<div class="links"><button class="linkbtn" data-act="speak">Read the question aloud</button><button class="linkbtn" data-act="auto">Auto-read: '+(S.readAloud?'on':'off')+'</button></div>';
  if(s.type==='text'){
    if(s.sugg){var sg=s.sugg();if(sg.length)h+='<div class="chips" role="group" aria-label="Suggestions">'+sg.map(function(x){return'<button class="chip sugg" data-act="sugg" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>'}
    var dl=s.datalist?s.datalist():[];
    h+='<label class="sr" for="ans">Answer</label>'+(s.short?'<input type="text" id="ans" autocomplete="off"'+(dl.length?' list="dl"':'')+' placeholder="'+esc(s.ph||'')+'" value="'+esc(d[s.key]||'')+'">':
       '<textarea id="ans" placeholder="'+esc(s.ph||'')+'">'+esc(d[s.key]||'')+'</textarea>');
    if(dl.length)h+='<datalist id="dl">'+dl.map(function(x){return'<option value="'+esc(x)+'"></option>'}).join('')+'</datalist>';
    if(s.key==='owner')h+='<p class="small" id="ownmatch">'+esc(matchText(d.owner))+'</p>';
  }else if(s.type==='choice'){
    var oo=s.opts,isOther=s.other&&(S.otherOn||(d[s.key]&&!oo.some(function(o){return o.id===d[s.key]})));
    h+='<div class="chips" role="group" aria-label="'+esc(s.field)+'">'+oo.map(function(o){
      return'<button class="chip" data-act="pick" data-v="'+esc(o.id)+'" aria-pressed="'+(!isOther&&d[s.key]===o.id)+'">'+esc(o.label)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>'}).join('')+
      (s.other?'<button class="chip" data-act="other" aria-pressed="'+(!!isOther)+'">Other</button>':'')+'</div>';
    if(isOther)h+='<label class="sr" for="ans">Other</label><input type="text" id="ans" autocomplete="off" placeholder="'+esc(s.ph||'')+'" value="'+esc(d[s.key]||'')+'">';
  }else if(s.type==='date'){
    var v=d[s.key];
    h+='<div class="readout" id="dout">'+(v?esc(ISO.test(v)?nice(v):v):'No date yet')+'</div><div class="chips">'+s.chips().map(function(x){
      return'<button class="chip" data-act="due" data-v="'+esc(x[1])+'" aria-pressed="'+(v===x[1])+'">'+esc(x[0])+'</button>'}).join('')+'</div>'+
      '<label class="sr" for="dinp">Pick a date</label><input type="date" id="dinp" value="'+(ISO.test(v||'')?v:'')+'">';
  }else{
    h+='<label class="photolabel" for="photoinp">Add photos</label><input class="sr" type="file" id="photoinp" accept="image/*" multiple>'+
       (S.photos.length?'<div class="thumbs">'+S.photos.map(function(p,i){return'<div class="thumb"><img alt="Photo '+(i+1)+'" src="'+p+'"><button data-act="rmphoto" data-v="'+i+'" aria-label="Remove photo '+(i+1)+'">&times;</button></div>'}).join('')+'</div>':'<p class="small">No photos yet. You can finalize without one.</p>')+

/* ---------- voice ---------- */
function speak(then){
  try{
    if(!('speechSynthesis' in window)){if(then)then();return}
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(cur().q);u.lang='en-GB';
    u.onend=function(){if(then)then()};u.onerror=function(){if(then)then()};
    speechSynthesis.speak(u);
  }catch(e){if(then)then()}
}
function listen(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setHint('Voice capture is not available here. Type the answer, or use the keyboard mic.');return}
  try{
    var r=new SR();r.lang='en-GB';r.interimResults=false;
    S.live=true;render();
    r.onresult=function(e){applyVoice(e.results[0][0].transcript)};
    r.onerror=function(){S.live=false;S.hint='The mic is blocked in this preview. Type the answer, or use the keyboard mic.';render()};
    r.onend=function(){if(S.live){S.live=false;render()}};
    r.start();
  }catch(e){S.live=false;setHint('The mic is blocked in this preview. Type the answer, or use the keyboard mic.')}
}
function matchOpt(opts,low){
  var i,o;
  for(i=0;i<opts.length;i++){o=opts[i];if(o.kw&&o.kw.some(function(k){return new RegExp('\\b'+k+'\\b').test(low)}))return o}
  for(i=0;i<opts.length;i++){o=opts[i];if(low.indexOf(String(o.label).toLowerCase())>-1)return o}
  var nl=low.replace(/[^a-z0-9]/g,'');
  for(i=0;i<opts.length;i++){o=opts[i];var lb=String(o.label).toLowerCase().replace(/[^a-z0-9]/g,'');if(lb.length>1&&nl.indexOf(lb)>-1)return o}
  var t=low.trim(),hits=opts.filter(function(x){return t.length>2&&String(x.label).toLowerCase().indexOf(t)>-1});
  return hits.length===1?hits[0]:null;
}
var NUMW={zero:0,ten:10,'twenty five':25,'twenty-five':25,fifty:50,'seventy five':75,'seventy-five':75,ninety:90,'ninety five':95,'ninety-five':95,hundred:100,'one hundred':100,done:100,complete:100,completed:100};
function applyVoice(t){
  var s=cur(),low=t.toLowerCase();S.live=false;S.hint='Heard: "'+t+'"';
  if(s.type==='text'){
    var v=t.charAt(0).toUpperCase()+t.slice(1);
    S.draft[s.key]=(s.append&&S.draft[s.key])?S.draft[s.key]+' / '+v:v;
  }else if(s.type==='choice'){
    var hit=null;
    if(s.key==='progress'){
      var m=low.match(/(\d{1,3})/),pct=m?+m[1]:(NUMW[low.replace(/[^a-z\- ]/g,'').replace(/ percent$/,'').trim()]);
      if(pct!==undefined&&!isNaN(pct))hit=s.opts.filter(function(o){return Math.round(o.id*100)===pct})[0]||null;
    }else hit=matchOpt(s.opts,low);
    if(hit){S.otherOn=false;S.draft[s.key]=hit.id}else if(s.other){S.otherOn=true;S.draft[s.key]=t.charAt(0).toUpperCase()+t.slice(1)}else S.hint='Heard: "'+t+'". No match, please tap an option.';
  }else if(s.type==='date'){
    var wm=low.match(/week\s*(\d{1,2})/);
    if(/today/.test(low))S.draft[s.key]=plus(0);
    else if(/tomorrow/.test(low))S.draft[s.key]=plus(1);
    else if(/yesterday/.test(low))S.draft[s.key]=plus(-1);
    else if(s.allowWk&&/asap|as soon as possible/.test(low))S.draft[s.key]='ASAP';
    else if(s.allowWk&&wm)S.draft[s.key]='WK'+('0'+wm[1]).slice(-2);
    else if(s.allowWk&&/next week/.test(low))S.draft[s.key]=wk(1);
    else S.hint='Heard: "'+t+'". Please tap a date.';
  }
  render();
}
function setHint(t){S.hint=t;var el=document.getElementById('hint');if(el)el.textContent=t}

/* ---------- photos ---------- */
function shrink(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var m=640,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.55))};im.src=fr.result};
  fr.readAsDataURL(file);
}
function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
/* up to 4 photos on one canvas, squeezed until the text fits one Excel cell (32,767 characters) */
function collage(photos){
  var list=photos.filter(Boolean).slice(0,4),LIMIT=30000;
  if(!list.length)return Promise.resolve('');
  return Promise.all(list.map(loadImg)).then(function(imgs){
    imgs=imgs.filter(Boolean);if(!imgs.length)return '';
    var n=imgs.length,cols=n===1?1:2,rows=Math.ceil(n/cols),W=640,H=480;
    if(n===1){var k1=Math.min(640/imgs[0].width,640/imgs[0].height);W=Math.round(imgs[0].width*k1);H=Math.round(imgs[0].height*k1)}
    var scale=1,q=0.6,out='';
    for(var tries=0;tries<16;tries++){
      var w=Math.max(40,Math.round(W*scale)),h=Math.max(30,Math.round(H*scale));
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
      var cw=w/cols,ch=h/rows;
      imgs.forEach(function(im,i){var cx=(i%cols)*cw,cy=Math.floor(i/cols)*ch,k=Math.min(cw/im.width,ch/im.height),dw=im.width*k,dh=im.height*k;
        x.drawImage(im,cx+(cw-dw)/2,cy+(ch-dh)/2,dw,dh)});
      out=c.toDataURL('image/jpeg',q);
      if(out.length<=LIMIT)return out;
      if(q>0.35)q-=0.1;else scale*=0.85;
    }
    return out;
  });
}

/* ---------- people list import ---------- */
function importPeople(text){
  var add=0,skip=0,have={};ST.people.forEach(function(p){have[String(p.e).toLowerCase()]=1});
  String(text||'').split(/\r?\n/).forEach(function(line){
    var m=line.match(/[^\s<>,;\t"]+@[^\s<>,;\t"]+/);if(!m){if(line.trim())skip++;return}
    var e=m[0].replace(/[.,;]+$/,''),n=line.replace(m[0],'').replace(/[<>"';\t,]+/g,' ').replace(/\s+/g,' ').trim();
    if(!n)n=e.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()});
    if(have[e.toLowerCase()]){skip++;return}
    have[e.toLowerCase()]=1;ST.people.push({n:n,e:e});add++;
  });
  saveST();return 'Added '+add+', skipped '+skip+'.';
}

/* ---------- events ---------- */
var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v,s=cur();
  if(a==='tab'){S.view=v;S.hint='';S.delP=false;S.markArm=false;S.delS=false;render()}
  else if(a==='net'){S.sim=!S.sim;render()}
  else if(a==='speak'){speak()}
  else if(a==='auto'){S.readAloud=!S.readAloud;render()}
  else if(a==='mic'){S.hint='';if(S.readAloud)speak(listen);else listen()}
  else if(a==='pick'){var o=s.opts.filter(function(x){return String(x.id)===v})[0];if(o){S.otherOn=false;S.draft[s.key]=(S.draft[s.key]===o.id&&s.optional)?undefined:o.id;render()}}
  else if(a==='other'){S.otherOn=true;S.draft[s.key]='';render();var of=document.getElementById('ans');if(of)of.focus()}
  else if(a==='due'){S.draft[s.key]=v;render()}
  else if(a==='sugg'){S.draft[s.key]=(s.append&&S.draft[s.key]&&S.draft[s.key].indexOf(v)<0)?S.draft[s.key]+' / '+v:v;render()}
  else if(a==='next'){if(ready()){S.step++;S.hint='';S.banner='';render();if(S.readAloud)speak()}}
  else if(a==='back'){S.step--;S.hint='';render()}
  else if(a==='rmphoto'){S.photos.splice(+v,1);render()}
  else if(a==='final'){
    if(S.busy)return;
    var d=S.draft,l={u:Date.now(),photos:S.photos.slice(),pic:''};
    COLS.forEach(function(k){if(k)l[k]=d[k]===undefined?'':d[k]});
    if(l.deep!=='Y')l.deepRef='';
    if(l.esc!=='Y'){l.escDate='';l.escTo=''}
    var fin=function(pic){l.pic=pic||'';S.lines.push(l);S.busy=false;S.banner='Item '+pend().length+' added to the log.';S.draft=blank();S.otherOn=false;S.photos=[];S.step=0;S.hint='';save();render()};
    if(cellMode()&&l.photos.length){S.busy=true;b.disabled=true;setHint('Preparing the photo...');collage(l.photos).then(fin,function(){fin('')})}else fin('');
  }
  else if(a==='del'){if(String(S.del)===v){S.lines=S.lines.filter(function(l){return String(l.u)!==v});S.del='';save()}else S.del=+v;render()}
  else if(a==='marksent'){if(S.markArm){var td=plus(0);S.lines.forEach(function(l){if(!l.sent)l.sent=td});S.markArm=false;save();render()}else{S.markArm=true;render()}}
  else if(a==='unsend'){S.lines.forEach(function(l){if(String(l.u)===v)delete l.sent});save();render()}
  else if(a==='clrsent'){if(S.delS){S.lines=S.lines.filter(function(l){return !l.sent});S.delS=false;save()}else S.delS=true;render()}
  else if(a==='clrex'){S.lines=S.lines.filter(function(l){return !l.example});save();render()}
  else if(a==='share'){
    var sp=mailParts(),sn=function(t){S.sent=t;var n=document.getElementById('sentnote');if(n)n.textContent=t},sd={title:sp.subject,text:sp.body};
    if(!cellMode()){var fl=[];pend().forEach(function(l,i){photoNames(l,i).forEach(function(nm,k){if(l.photos[k])fl.push(dataFile(l.photos[k],nm))})});
      try{if(fl.length&&navigator.canShare&&navigator.canShare({files:fl}))sd.files=fl}catch(x){}}
    if(navigator.share){navigator.share(sd).then(function(){sn('Shared. Tap Mark as sent once the email has gone.')},function(err){if(!err||err.name!=='AbortError')sn('The share sheet did not open here. Use Email or Copy email.')})}
    else sn('Sharing is not available in this viewer. Use Email or Copy email.');
  }
  else if(a==='email'){
    var ep=mailParts(),ok=copySync(ep.body),url='mailto:'+encodeURIComponent(ST.sendTo||'')+'?subject='+encodeURIComponent(ep.subject)+'&body='+encodeURIComponent('Paste the copied SLI text here.');
    var en=document.getElementById('sentnote');S.sent=ok?'Email text copied. Paste it into the body of the email.':'Could not copy. Use Copy email first, then paste it into the email.';if(en)en.textContent=S.sent;
    location.href=url;
  }
  else if(a==='copy'){
    var mp=mailParts(),txt=v==='rows'?mp.rows:mp.body,msg=function(t){var n=document.getElementById('sentnote');if(n)n.textContent=t};
    var done=v==='rows'?'SLI rows copied. Paste into column A of the next empty row.':'Email copied.';
    var sel=function(){var el=document.getElementById('mailbody');if(el){var r=document.createRange();r.selectNodeContents(el);var g=getSelection();g.removeAllRanges();g.addRange(r);msg('Selected. Use Copy from the menu.')}};
    if(copySync(txt))msg(done);else{try{navigator.clipboard.writeText(txt).then(function(){msg(done)},sel)}catch(x){sel()}}
  }
  else if(a==='pmode'){ST.photoMode=v;saveST();render()}
  else if(a==='addp'){ST.people.push({n:'',e:''});saveST();render();var f=document.getElementById('p-'+(ST.people.length-1)+'-n');if(f)f.focus()}
  else if(a==='delp'){ST.people.splice(+v,1);saveST();render()}
  else if(a==='clrp'){if(S.delP){ST.people=[];S.delP=false;saveST()}else S.delP=true;render()}
  else if(a==='import'){var ta=document.getElementById('paste');S.pmsg=importPeople(ta?ta.value:'');render()}
});
app.addEventListener('input',function(e){
  var t=e.target,s=cur();
  if(t.id==='ans'){S.draft[s.key]=t.value;updNext();if(s.key==='owner'){var om=document.getElementById('ownmatch');if(om)om.textContent=matchText(t.value)}}
  else if(t.id==='dinp'){S.draft[s.key]=t.value;var o=document.getElementById('dout');if(o)o.textContent=t.value?nice(t.value):'No date yet';updNext()}
  else if(t.id==='set-areas'){ST.areas=t.value.split('\n').map(function(x){return x.trim()}).filter(Boolean);saveST()}
  else if(t.id.indexOf('set-')===0){var k=t.id.slice(4);ST[k]=k==='photoCol'?t.value.toUpperCase().replace(/[^A-Z]/g,''):t.value;saveST()}
  else if(t.dataset&&t.dataset.p!==undefined){ST.people[+t.dataset.p][t.dataset.f]=t.value;saveST()}
});
app.addEventListener('change',function(e){
  if(e.target.id==='photoinp'){
    var files=Array.prototype.slice.call(e.target.files||[]),left=files.length;if(!left)return;
    files.forEach(function(f){shrink(f,function(u){S.photos.push(u);if(--left===0)render()})});
  }
});
window.addEventListener('online',render);window.addEventListener('offline',render);
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
